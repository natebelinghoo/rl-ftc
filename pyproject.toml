[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-ftc"
version = "0.1.0"
description = "Reinforcement Learning Based Fault-Tolerant Control"
readme = "README.md"
# 稍微放宽Python版本限制，增加兼容性，当然 >=3.12 也没问题
requires-python = ">=3.10"

dependencies = [
    # --- 核心算法库 ---
    # 移除 [extra] 以避免安装 Atari 相关依赖 (ale-py 需要 OpenCV)
    "stable-baselines3>=2.3.0",
    
    # --- 环境库 ---
    "gymnasium>=0.29.1",
    "highway-env>=1.8.2",
    
    # --- 科学计算与绘图 ---
    "numpy>=1.26",
    "matplotlib>=3.8",
    
    # --- 辅助工具 ---
    "moviepy>=1.0.3",
    "shimmy>=0.2.0",
]

[tool.setuptools.packages.find]
# 这样设置可以让你直接 import src.envs...
where = ["."]
include = ["src*"]